name: CD — Deploy & DAST (Kalanko)

on:
  push:
    branches: [main]

jobs:

  # =====================
  # ÉTAPE 6 — DEPLOY PRODUCTION (migrations Alembic dans le script)
  # =====================
  deploy:
    name: "6 · Deploy production VPS"
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kalanko/app
            git pull origin main
            docker compose up -d --build
            sudo cp /opt/kalanko/app/monitoring/caddyfile-prod /etc/caddy/Caddyfile
            caddy validate --config /etc/caddy/Caddyfile && sudo systemctl reload caddy
            docker compose exec -T backend alembic upgrade head

  # =====================
  # ÉTAPE 7 — DAST
  # =====================
  dast:
    name: "7 · DAST — OWASP ZAP"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: 'https://kalanko.tech'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: true
          artifact_name: 'rapport-zap-kalanko'
