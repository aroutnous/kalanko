name: CD — Deploy & DAST (Kalanko)

on:
  push:
    branches: [main]

jobs:

  # =====================
  # ÉTAPE 6 — DEPLOY PRODUCTION (migrations Alembic dans le script)
  # =====================
  deploy:
    name: "6 · Deploy production VPS"
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kalanko/app
            git pull origin main
            docker compose up -d --build
            sudo cp /opt/kalanko/app/monitoring/caddyfile-prod /etc/caddy/Caddyfile
            caddy validate --config /etc/caddy/Caddyfile && sudo systemctl reload caddy
            docker compose exec -T backend alembic upgrade head

  # =====================
  # ÉTAPE 7 — DAST
  # =====================
  dast:
    name: "7 · DAST — OWASP ZAP"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OWASP ZAP Full Scan
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t https://kalanko.tech \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -a \
            -I
        continue-on-error: true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-zap-kalanko
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30
